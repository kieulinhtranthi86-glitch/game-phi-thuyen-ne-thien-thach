
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Escape - Phi Thuyền Né Thiên Thạch</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:16px 10px;
  background:radial-gradient(ellipse at top,#17275b,#060817 70%);
  color:#fff;font-family:Arial,sans-serif;text-align:center
}
h1{margin:8px 0;color:#7cf7ff;letter-spacing:2px;
  text-shadow:0 0 15px #00bfff}
.subtitle{color:#b8c9f5;margin:8px}
#hud{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px auto;max-width:430px}
.stat{background:#111b3c;border:1px solid #385eaa;border-radius:10px;padding:9px 13px}
.stat span{color:#80f7ff;font-weight:bold}
#wrap{position:relative;width:min(94vw,420px);margin:auto}
canvas{display:block;width:100%;height:auto;border:2px solid #54eaff;
  border-radius:14px;box-shadow:0 0 25px #176bba;background:#070b22}
#overlay{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#05091ccf;
  border-radius:14px}
#panel{width:100%;padding:20px 12px;border:1px solid #4eeaff;
  border-radius:15px;background:#101936ed;box-shadow:0 0 24px #176bba}
#panel h2{color:#73f5ff;font-size:25px;margin:5px}
#panel p{line-height:1.6;color:#d3defd}
button{border:0;border-radius:9px;padding:11px 15px;margin:4px;
  background:linear-gradient(120deg,#36efff,#648bff);color:#07132d;
  font-size:14px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.96)}
.secondary{background:#25365f;color:#fff;border:1px solid #6684bd}
#actions{margin:10px auto}
#message{min-height:24px;color:#ffe88a;font-weight:bold}
#touch{display:flex;justify-content:center;gap:32px;margin:8px auto}
#touch button{width:78px;height:53px;font-size:24px;touch-action:none}
small{color:#aebde5}
</style>
</head>
<body>
<h1>🚀 GALAXY ESCAPE</h1>
<p class="subtitle">Né thiên thạch · Sinh tồn · Chinh phục vũ trụ</p>

<div id="hud">
  <div class="stat">⭐ Điểm: <span id="score">0</span></div>
  <div class="stat">🏆 Kỷ lục: <span id="best">0</span></div>
  <div class="stat">❤️ Mạng: <span id="lives">3</span></div>
  <div class="stat">🌌 Cấp: <span id="level">1</span></div>
</div>

<div id="wrap">
  <canvas id="game" width="420" height="560"></canvas>
  <div id="overlay">
    <div id="panel">
      <h2 id="panelTitle">GALAXY ESCAPE</h2>
      <p id="panelText">Lái phi thuyền né thiên thạch.<br>
      Sống sót càng lâu, điểm càng cao!</p>
      <button id="mainButton">🚀 BẮT ĐẦU</button>
    </div>
  </div>
</div>

<div id="actions">
  <button id="pauseButton" class="secondary">⏸ Tạm dừng</button>
  <button id="soundButton" class="secondary">🔊 Âm thanh: Bật</button>
</div>

<div id="message">Sẵn sàng khám phá vũ trụ!</div>

<div id="touch">
  <button id="left" aria-label="Sang trái">⬅️</button>
  <button id="right" aria-label="Sang phải">➡️</button>
</div>
<small>Máy tính: phím ← → hoặc A, D · Điện thoại: dùng nút hai bên</small>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=canvas.width,H=canvas.height;

let mode="menu",ship,rocks,stars,particles;
let score=0,lives=3,level=1,best=0;
let last=0,spawn=0,invulnerable=0,anim=0;
let soundOn=true,audio=null;
const keys={left:false,right:false};

try{best=Number(localStorage.getItem("galaxyBest"))||0}catch(e){}
$("best").textContent=best;

function beep(freq=440,duration=.08,type="sine"){
  if(!soundOn)return;
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.type=type;osc.frequency.value=freq;
    gain.gain.setValueAtTime(.08,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.connect(gain);gain.connect(audio.destination);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}

function reset(){
  ship={x:W/2,y:H-65};
  rocks=[];particles=[];score=0;lives=3;level=1;
  spawn=0;invulnerable=0;
  stars=Array.from({length:95},()=>({
    x:Math.random()*W,y:Math.random()*H,
    s:Math.random()*2+.5,v:25+Math.random()*100
  }));
  updateHUD();
}

function updateHUD(){
  $("score").textContent=score;
  $("lives").textContent=lives;
  $("level").textContent=level;
  $("best").textContent=best;
}

function showOverlay(title,text,button){
  $("panelTitle").textContent=title;
  $("panelText").innerHTML=text;
  $("mainButton").textContent=button;
  $("overlay").style.display="flex";
}

function start(){
  if(anim)cancelAnimationFrame(anim);
  reset();mode="playing";last=0;
  $("overlay").style.display="none";
  $("message").textContent="Né thiên thạch nào!";
  beep(600,.12);
  anim=requestAnimationFrame(loop);
}

function pause(){
  if(mode==="playing"){
    mode="paused";
    keys.left=keys.right=false;
    showOverlay("⏸ TẠM DỪNG","Nghỉ một chút rồi tiếp tục hành trình nhé!","▶ TIẾP TỤC");
    $("mainButton").onclick=resume;
    $("message").textContent="Trò chơi đang tạm dừng.";
  }else if(mode==="paused")resume();
}

function resume(){
  mode="playing";last=0;
  $("overlay").style.display="none";
  $("mainButton").onclick=start;
  anim=requestAnimationFrame(loop);
}

function gameOver(){
  mode="over";
  keys.left=keys.right=false;
  if(score>best){
    best=score;
    try{localStorage.setItem("galaxyBest",best)}catch(e){}
  }
  updateHUD();
  beep(130,.35,"sawtooth");
  showOverlay("💥 GAME OVER",
    "Điểm của bạn: <b>"+score+"</b><br>Kỷ lục: <b>"+best+
    "</b><br>Bạn có thể thử lại để đạt điểm cao hơn!","🔄 CHƠI LẠI");
  $("mainButton").onclick=start;
  $("message").textContent="Phi thuyền đã kết thúc hành trình.";
}

function burst(x,y,color,count=18){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const speed=30+Math.random()*180;
    particles.push({
      x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
      life:.3+Math.random()*.65,max:.95,
      size:2+Math.random()*4,color
    });
  }
}

function drawShip(){
  ctx.save();ctx.translate(ship.x,ship.y);
  ctx.shadowBlur=18;ctx.shadowColor="#31eaff";
  ctx.fillStyle="#ff9e43";
  ctx.beginPath();ctx.moveTo(-8,13);ctx.lineTo(0,32+Math.random()*5);
  ctx.lineTo(8,13);ctx.fill();
  ctx.fillStyle="#35dfff";
  ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(17,17);
  ctx.lineTo(0,10);ctx.lineTo(-17,17);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(7,11);
  ctx.lineTo(-7,11);ctx.closePath();ctx.fill();
  ctx.fillStyle="#0a2b64";
  ctx.beginPath();ctx.ellipse(0,-3,4,7,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawRock(r){
  ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
  ctx.shadowBlur=9;ctx.shadowColor="#ff865d";
  ctx.fillStyle="#777f9e";ctx.strokeStyle="#cbd7ef";ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI*2/10,rad=r.r*(i%2?.78:1);
    const x=Math.cos(a)*rad,y=Math.sin(a)*rad;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle="#4a526e";
  ctx.beginPath();ctx.arc(-r.r*.22,-r.r*.1,r.r*.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function draw(dt){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#090d2b");grad.addColorStop(1,"#141044");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  for(const s of stars){
    s.y+=s.v*dt;
    if(s.y>H){s.y=0;s.x=Math.random()*W}
    ctx.globalAlpha=.4+s.s/4;
    ctx.fillStyle="#c8f4ff";ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  for(const r of rocks)drawRock(r);

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;

  if(ship&&(invulnerable<=0||Math.floor(invulnerable*12)%2===0))
    drawShip();
}

function update(dt){
  if(keys.left)ship.x-=270*dt;
  if(keys.right)ship.x+=270*dt;
  ship.x=Math.max(22,Math.min(W-22,ship.x));
  invulnerable=Math.max(0,invulnerable-dt);

  level=1+Math.floor(score/10);
  spawn+=dt;
  if(spawn>Math.max(.25,.8-level*.055)){
    spawn=0;
    const r=13+Math.random()*13;
    rocks.push({
      x:r+Math.random()*(W-2*r),y:-r,r,
      speed:100+Math.random()*60+level*12,
      rot:Math.random()*6,spin:(Math.random()-.5)*2
    });
  }

  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];
    r.y+=r.speed*dt;r.rot+=r.spin*dt;

    if(r.y-r.r>H){
      rocks.splice(i,1);score++;updateHUD();
      beep(720,.04);
      if(score>best){best=score;updateHUD()}
      continue;
    }

    if(invulnerable<=0&&Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+14){
      burst(ship.x,ship.y,"#ffb34f",24);
      burst(r.x,r.y,"#73efff",12);
      rocks.splice(i,1);lives--;invulnerable=1.2;
      updateHUD();beep(180,.18,"square");
      if(lives<=0){gameOver();return}
    }
  }
}

function loop(t){
  if(mode!=="playing")return;
  const dt=last?Math.min((t-last)/1000,.035):0;
  last=t;
  draw(dt);update(dt);
  if(mode==="playing")anim=requestAnimationFrame(loop);
}

function setKey(k,v){keys[k]=v}
document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")setKey("left",true);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")setKey("right",true);
  if(e.key===" "&&mode==="menu")start();
  if(e.key==="Escape"||e.key.toLowerCase()==="p"){
    if(mode==="playing"||mode==="paused")pause();
  }
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")setKey("left",false);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")setKey("right",false);
});

function bindTouch(id,k){
  const b=$(id);
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();b.setPointerCapture(e.pointerId);setKey(k,true);
  });
  for(const ev of ["pointerup","pointercancel","lostpointercapture"])
    b.addEventListener(ev,()=>setKey(k,false));
}
bindTouch("left","left");bindTouch("right","right");

$("mainButton").onclick=start;
$("pauseButton").onclick=pause;
$("soundButton").onclick=()=>{
  soundOn=!soundOn;
  $("soundButton").textContent=soundOn?"🔊 Âm thanh: Bật":"🔇 Âm thanh: Tắt";
  if(soundOn)beep();
};

reset();draw(0);
showOverlay("GALAXY ESCAPE",
  "🚀 Điều khiển phi thuyền né thiên thạch.<br>"+
  "Mỗi thiên thạch vượt qua giúp bạn tăng điểm.<br>"+
  "Bạn có 3 mạng. Cứ mỗi 10 điểm, cấp độ tăng!","🚀 BẮT ĐẦU");
</script>
</body>
</html>
